name: Build Safe iOS Audio Bridge Tweak

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'build/**'
      - 'feature/**'
    paths:
      - '.github/workflows/build-audio-bridge-safe-tweak.yml'
      - 'ios/audio_bridge_safe_tweak/**'

jobs:
  build-rootless:
    name: Build restricted rootless .deb
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install packaging tools
        run: |
          brew update
          brew install dpkg ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build safe audio bridge tweak
        working-directory: ios/audio_bridge_safe_tweak
        run: |
          make clean package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          find packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: iosvcam-audio-bridge-safe-rootless-deb
          path: ios/audio_bridge_safe_tweak/packages/*.deb
          if-no-files-found: error
