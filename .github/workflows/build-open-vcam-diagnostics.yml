name: Build OpenVCam Diagnostics (photo colour / mode-switch)

# Builds the photo-red / mode-switch diagnostic variants in ONE run so a single push
# yields debs to A/B on-device (0.5.6). The default release build (blur/cycling fix via
# the private dedup key) comes from build-open-vcam-tweak.yml; these are the opt-in
# photo-colour candidates:
#   photored    -> VCAM_HOOK_PHOTO_NODES=1  (stamp colour on the actual still buffer +
#                  overwrite it; the encoder-path red fix — RE-VERIFY no photo-mode
#                  GPU deadlock on device before trusting)
#   matrix709   -> VCAM_DEST_MATRIX_709=1   (write+tag 709 instead of 601; the cheap
#                  red A/B with NO photo-node hook, so no deadlock risk)
#   photored709 -> both, for when the still buffer wants 709 AND the encoder hook
# Each variant gets a distinct package Version (0.5.6+<label>) so dpkg installs one
# cleanly over the other, and the tweak logs its toggle state at startup so the syslog
# proves which one is running. See Tweak.xm VCAM_HOOK_PHOTO_NODES / VCAM_DEST_MATRIX_709.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'build/**'
      - 'feature/**'
    paths:
      - '.github/workflows/build-open-vcam-diagnostics.yml'
      - 'ios/open_vcam_tweak/**'

jobs:
  build-diagnostics:
    name: Build ${{ matrix.label }} .deb
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: noaudio
            flags: VCAM_AUDIO_DISABLE=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install packaging tools
        run: |
          brew update
          brew install dpkg ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Stamp diagnostic version
        working-directory: ios/open_vcam_tweak
        run: |
          # Distinct version per variant so the two debs never collide and dpkg
          # installs one over the other cleanly. -i.bak is portable BSD/GNU sed.
          sed -i.bak 's/^Version: .*/Version: 0.6.33+${{ matrix.label }}/' control
          rm -f control.bak
          grep '^Version:' control

      - name: Build ${{ matrix.label }}
        working-directory: ios/open_vcam_tweak
        run: |
          echo "Building diagnostic variant '${{ matrix.label }}' with: ${{ matrix.flags }}"
          make clean package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 ${{ matrix.flags }}
          find packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Retag package architecture
        run: |
          python3 ios/retag_deb_architecture.py --architecture iphoneos-arm64e ios/open_vcam_tweak/packages/*.deb

      - name: Validate package
        run: |
          for deb in ios/open_vcam_tweak/packages/*.deb; do
            python3 ios/validate_deb.py "$deb"
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
          done

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-vcam-diag-${{ matrix.label }}
          path: ios/open_vcam_tweak/packages/*.deb
          if-no-files-found: error
