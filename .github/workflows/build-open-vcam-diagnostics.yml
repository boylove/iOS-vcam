name: Build OpenVCam Diagnostics (freeze hunt)

# Builds the two freeze-hunt diagnostic variants in ONE run so a single push
# yields both debs to A/B on-device against the ~24-frame preview wedge:
#   destcolor -> VCAM_DEST_COLOR=1  (pin destination colour like closed vcamera)
#   cpuxfer   -> VCAM_GPU_ACCEL=0   (force CPU transfer; isolate the GPU fence)
# Each variant gets a distinct package Version (0.5.2+<label>) so dpkg installs
# one cleanly over the other, and the tweak logs DEST_COLOR/GPU_ACCEL at startup
# so the syslog proves which one is running. See Tweak.xm freeze-hunt toggles.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'build/**'
      - 'feature/**'
    paths:
      - '.github/workflows/build-open-vcam-diagnostics.yml'
      - 'ios/open_vcam_tweak/**'

jobs:
  build-diagnostics:
    name: Build ${{ matrix.label }} .deb
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: destcolor
            flags: VCAM_DEST_COLOR=1
          - label: cpuxfer
            flags: VCAM_GPU_ACCEL=0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install packaging tools
        run: |
          brew update
          brew install dpkg ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Stamp diagnostic version
        working-directory: ios/open_vcam_tweak
        run: |
          # Distinct version per variant so the two debs never collide and dpkg
          # installs one over the other cleanly. -i.bak is portable BSD/GNU sed.
          sed -i.bak 's/^Version: .*/Version: 0.5.2+${{ matrix.label }}/' control
          rm -f control.bak
          grep '^Version:' control

      - name: Build ${{ matrix.label }}
        working-directory: ios/open_vcam_tweak
        run: |
          echo "Building diagnostic variant '${{ matrix.label }}' with: ${{ matrix.flags }}"
          make clean package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 ${{ matrix.flags }}
          find packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Retag package architecture
        run: |
          python3 ios/retag_deb_architecture.py --architecture iphoneos-arm64e ios/open_vcam_tweak/packages/*.deb

      - name: Validate package
        run: |
          for deb in ios/open_vcam_tweak/packages/*.deb; do
            python3 ios/validate_deb.py "$deb"
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
          done

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-vcam-diag-${{ matrix.label }}
          path: ios/open_vcam_tweak/packages/*.deb
          if-no-files-found: error
