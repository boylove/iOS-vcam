name: Build OpenVCam Tweak

on:
  workflow_dispatch:
    inputs:
      hook_photo_nodes:
        description: 'Hook the still-photo nodes (1 = on, matches release; 0 = diagnostic build to test the "moves once then freezes" photo-path regression)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '0'
      debug:
        description: 'Verbose per-frame logging (VCAM_DEBUG=1)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
  push:
    branches:
      - main
      - 'build/**'
      - 'feature/**'
    paths:
      - '.github/workflows/build-open-vcam-tweak.yml'
      - 'ios/open_vcam_tweak/**'
      - 'ios/retag_deb_architecture.py'
      - 'ios/validate_deb.py'

jobs:
  build-rootless:
    name: Build rootless arm64e .deb
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install packaging tools
        run: |
          brew update
          brew install dpkg ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build OpenVCam tweak
        working-directory: ios/open_vcam_tweak
        env:
          # workflow_dispatch inputs default to '' on push/CI triggers; fall back
          # to the release defaults (photo hooks on, debug off).
          HOOK_PHOTO_NODES: ${{ github.event.inputs.hook_photo_nodes || '1' }}
          VCAM_DEBUG: ${{ github.event.inputs.debug || '0' }}
        run: |
          echo "Building with VCAM_HOOK_PHOTO_NODES=$HOOK_PHOTO_NODES VCAM_DEBUG=$VCAM_DEBUG"
          make clean package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 \
            VCAM_HOOK_PHOTO_NODES="$HOOK_PHOTO_NODES" VCAM_DEBUG="$VCAM_DEBUG"
          find packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Retag package architecture
        run: |
          python3 ios/retag_deb_architecture.py --architecture iphoneos-arm64e ios/open_vcam_tweak/packages/*.deb

      - name: Validate package
        run: |
          for deb in ios/open_vcam_tweak/packages/*.deb; do
            python3 ios/validate_deb.py "$deb"
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
          done

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          # Name carries the photo-hook state so a diagnostic (photo=0) build is
          # never confused with a release (photo=1) build after download.
          name: open-vcam-tweak-rootless-deb-photo${{ github.event.inputs.hook_photo_nodes || '1' }}
          path: ios/open_vcam_tweak/packages/*.deb
          if-no-files-found: error
