name: Build OpenVCam Tweak

on:
  workflow_dispatch:
    inputs:
      hook_photo_nodes:
        description: 'Hook the still-photo nodes (1 = on, matches release; 0 = diagnostic build to test the "moves once then freezes" photo-path regression)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '0'
      debug:
        description: 'Verbose per-frame logging (VCAM_DEBUG=1)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
  push:
    branches:
      - main
      - 'build/**'
      - 'feature/**'
    paths:
      - '.github/workflows/build-open-vcam-tweak.yml'
      - 'ios/open_vcam_tweak/**'
      - 'ios/retag_deb_architecture.py'
      - 'ios/validate_deb.py'

jobs:
  build-rootless:
    name: Build rootless arm64e .deb
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install packaging tools
        run: |
          brew update
          brew install dpkg ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build OpenVCam tweak
        working-directory: ios/open_vcam_tweak
        env:
          # On push/CI these inputs are '' -> we pass NOTHING for that toggle and
          # the compiled-in default in Tweak.xm wins (photo hooks OFF: the photo
          # render-node overwrite GPU-iofence-deadlocks, §4.9). Only an explicit
          # workflow_dispatch choice overrides it — do NOT re-introduce a `|| '1'`
          # fallback here, that silently forces photo=1 on every push build.
          HOOK_PHOTO_NODES: ${{ github.event.inputs.hook_photo_nodes }}
          VCAM_DEBUG: ${{ github.event.inputs.debug }}
        run: |
          MAKE_ARGS=""
          if [ -n "$HOOK_PHOTO_NODES" ]; then
            MAKE_ARGS="$MAKE_ARGS VCAM_HOOK_PHOTO_NODES=$HOOK_PHOTO_NODES"
          fi
          if [ -n "$VCAM_DEBUG" ]; then
            MAKE_ARGS="$MAKE_ARGS VCAM_DEBUG=$VCAM_DEBUG"
          fi
          echo "Building with overrides: [${MAKE_ARGS:-none — using Tweak.xm compiled defaults}]"
          make clean package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 $MAKE_ARGS
          find packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Retag package architecture
        run: |
          python3 ios/retag_deb_architecture.py --architecture iphoneos-arm64e ios/open_vcam_tweak/packages/*.deb

      - name: Validate package
        run: |
          for deb in ios/open_vcam_tweak/packages/*.deb; do
            python3 ios/validate_deb.py "$deb"
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
          done

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          # Name carries the photo-hook state so builds aren't confused after
          # download. On push (no dispatch input) the code default wins — which is
          # photo OFF — so label it 'default'; a dispatch build reflects its choice.
          name: open-vcam-tweak-rootless-deb-photo${{ github.event.inputs.hook_photo_nodes || 'default-off' }}
          path: ios/open_vcam_tweak/packages/*.deb
          if-no-files-found: error
