name: Build iOS Audio Bridge System Hook Tweak

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'build/**'
      - 'feature/**'
    paths:
      - '.github/workflows/build-audio-bridge-system-hook-tweak.yml'
      - 'ios/audio_bridge_common/**'
      - 'ios/audio_bridge_system_tweak/**'
      - 'ios/retag_deb_architecture.py'
      - 'ios/validate_deb.py'

jobs:
  build-system-hook:
    name: Build passive mediaserverd system hook .deb
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install packaging tools
        run: |
          brew update
          brew install dpkg ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build system hook tweak
        working-directory: ios/audio_bridge_system_tweak
        run: |
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/postrm
          make clean package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          find packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Retag system hook architecture and add backup dylib
        run: |
          python3 ios/retag_deb_architecture.py \
            --architecture iphoneos-arm64e \
            --backup-dylib var/jb/Library/MobileSubstrate/DynamicLibraries/iOSVCAMAudioBridgeSystemHook.dylib \
            --backup-dest var/jb/usr/lib/iosvcam/iOSVCAMAudioBridgeSystemHook.dylib \
            ios/audio_bridge_system_tweak/packages/*.deb

      - name: Validate system hook package
        run: |
          for deb in ios/audio_bridge_system_tweak/packages/*.deb; do
            python3 ios/validate_deb.py "$deb"
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
          done

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: iosvcam-audio-bridge-system-hook-rootless-deb
          path: ios/audio_bridge_system_tweak/packages/*.deb
          if-no-files-found: error
